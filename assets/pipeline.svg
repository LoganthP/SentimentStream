<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="230" viewBox="0 0 1200 230" role="img" aria-label="Animated SentimentStream data pipeline">
  <defs>
    <linearGradient id="pbg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#f472b6"/>
    </linearGradient>
  </defs>
  <style>
    .lbl { font: 700 15px 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; fill: #f8fafc; }
    .sub { font: 500 12px 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; fill: #94a3b8; }
    .ico { font: 26px 'Segoe UI Emoji', 'Apple Color Emoji', 'Noto Color Emoji', sans-serif; }
    .node { animation: pulse 3.5s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes pulse { 0%,100% { stroke-opacity: 0.25; } 50% { stroke-opacity: 0.9; } }
  </style>
  <rect width="1200" height="230" rx="20" fill="url(#pbg)"/>

  <path id="track" d="M110 115 H1090" stroke="url(#line)" stroke-width="3" stroke-opacity="0.35" fill="none"/>
  <path d="M110 115 H1090" stroke="url(#line)" stroke-width="3" fill="none" stroke-dasharray="10 14">
    <animate attributeName="stroke-dashoffset" from="0" to="-240" dur="3s" repeatCount="indefinite"/>
  </path>

  <!-- packets -->
  <circle r="6" fill="#4ade80"><animateMotion dur="5s" repeatCount="indefinite" path="M110 115 H1090"/></circle>
  <circle r="6" fill="#f87171"><animateMotion dur="5s" begin="1.6s" repeatCount="indefinite" path="M110 115 H1090"/></circle>
  <circle r="6" fill="#facc15"><animateMotion dur="5s" begin="3.2s" repeatCount="indefinite" path="M110 115 H1090"/></circle>

  <!-- nodes: 6 stages -->
  <g>
    <rect class="node" x="40"  y="70" width="140" height="90" rx="16" fill="#ffffff" fill-opacity="0.07" stroke="#38bdf8" stroke-width="2"/>
    <text x="110" y="105" text-anchor="middle" class="ico">📥</text>
    <text x="110" y="132" text-anchor="middle" class="lbl">Ingest</text>
    <text x="110" y="150" text-anchor="middle" class="sub">CSV · JSON · Parquet</text>

    <rect class="node" x="236" y="70" width="140" height="90" rx="16" fill="#ffffff" fill-opacity="0.07" stroke="#60a5fa" stroke-width="2" style="animation-delay:.5s"/>
    <text x="306" y="105" text-anchor="middle" class="ico">🗄️</text>
    <text x="306" y="132" text-anchor="middle" class="lbl">Data Lake</text>
    <text x="306" y="150" text-anchor="middle" class="sub">Local / HDFS</text>

    <rect class="node" x="432" y="70" width="140" height="90" rx="16" fill="#ffffff" fill-opacity="0.07" stroke="#818cf8" stroke-width="2" style="animation-delay:1s"/>
    <text x="502" y="105" text-anchor="middle" class="ico">🧹</text>
    <text x="502" y="132" text-anchor="middle" class="lbl">Preprocess</text>
    <text x="502" y="150" text-anchor="middle" class="sub">clean · dedupe · tokens</text>

    <rect class="node" x="628" y="70" width="140" height="90" rx="16" fill="#ffffff" fill-opacity="0.07" stroke="#a78bfa" stroke-width="2" style="animation-delay:1.5s"/>
    <text x="698" y="105" text-anchor="middle" class="ico">🧠</text>
    <text x="698" y="132" text-anchor="middle" class="lbl">MLlib</text>
    <text x="698" y="150" text-anchor="middle" class="sub">TF-IDF · LogReg</text>

    <rect class="node" x="824" y="70" width="140" height="90" rx="16" fill="#ffffff" fill-opacity="0.07" stroke="#e879f9" stroke-width="2" style="animation-delay:2s"/>
    <text x="894" y="105" text-anchor="middle" class="ico">📊</text>
    <text x="894" y="132" text-anchor="middle" class="lbl">Spark SQL</text>
    <text x="894" y="150" text-anchor="middle" class="sub">trends · anomalies</text>

    <rect class="node" x="1020" y="70" width="140" height="90" rx="16" fill="#ffffff" fill-opacity="0.07" stroke="#f472b6" stroke-width="2" style="animation-delay:2.5s"/>
    <text x="1090" y="105" text-anchor="middle" class="ico">✨</text>
    <text x="1090" y="132" text-anchor="middle" class="lbl">Dashboard</text>
    <text x="1090" y="150" text-anchor="middle" class="sub">FastAPI → React</text>
  </g>

  <text x="600" y="38" text-anchor="middle" class="lbl" style="font-size:17px">From raw posts to live insight — one distributed Spark job</text>
  <text x="600" y="200" text-anchor="middle" class="sub">Progressive results stream to the dashboard as each stage finishes</text>
</svg>
